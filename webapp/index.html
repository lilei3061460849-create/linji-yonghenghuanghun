<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>临济·永恒黄昏 · 开放世界</title>
<style>
  :root{
    --bg:#0d1014; --panel:#151a21; --panel-2:#1b222b; --line:#28313c;
    --text:#dbe3ee; --muted:#8a97a7; --gold:#d8b45a; --ally:#6fca94;
    --enemy:#e2645a; --merchant:#e0c060; --fog:#12161b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#1a222c 0%,var(--bg) 60%);
    color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
  button{font:inherit;color:var(--text);background:var(--panel-2);border:1px solid var(--line);
    border-radius:6px;padding:5px 10px;cursor:pointer;transition:.15s}
  button:hover:not(:disabled){border-color:var(--gold);color:#fff}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:#2c2415;border-color:#6d5a2a;color:#f2d99a}
  button.primary:hover:not(:disabled){background:#3a2f1b;border-color:var(--gold)}
  button.danger{border-color:#5c2b27;color:#f0a49c;background:#241716}
  input,select{font:inherit;color:var(--text);background:#0f141a;border:1px solid var(--line);
    border-radius:5px;padding:4px 6px;min-width:0}
  header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:10px 18px;
    border-bottom:1px solid var(--line);background:#10151b;position:sticky;top:0;z-index:5}
  header h1{font-size:15px;margin:0;letter-spacing:.12em;color:var(--gold);font-weight:600}
  .stats{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px}
  .stat b{color:#fff;font-weight:600}
  .bar{width:120px;height:8px;border-radius:4px;background:#232b34;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#7b2f2a,#d9584c)}
  .bar.mana>i{background:linear-gradient(90deg,#264b7b,#4c8bd9)}
  .spacer{flex:1}
  main{display:grid;grid-template-columns:minmax(320px,1fr) 400px;gap:14px;padding:14px 18px 40px;
    max-width:1360px;margin:0 auto;align-items:start}
  @media (max-width:960px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
  .card h2{font-size:12px;letter-spacing:.16em;color:var(--muted);margin:0 0 10px;font-weight:600}
  .card h2 span{float:right;letter-spacing:0;color:#6b7684}
  .mapwrap{display:flex;flex-direction:column;gap:10px;align-items:center}
  #map{display:grid;gap:2px;background:#0a0d10;padding:8px;border-radius:8px;border:1px solid #202832;
    width:max-content;margin:0 auto;max-width:100%;overflow:auto}
  .cell{width:24px;height:24px;border-radius:3px;background:var(--fog);display:flex;align-items:center;
    justify-content:center;font-size:11px;color:#66707c;position:relative;cursor:default;user-select:none}
  .cell.known{background:#2a323c;color:#9aa6b3}
  .cell.known.wall{background:#0a0c0f;color:#313a44}
  .cell.known.water{background:#1d3140}
  .cell.known.event{background:#33301f}
  .cell.known.relic{background:#2f2438}
  .cell.known.resource{background:#1f2f2a}
  .cell.visible{box-shadow:inset 0 0 0 1px #3d4a58}
  .cell.reachable{outline:1px solid #4a5a3a;cursor:pointer}
  .cell.reachable:hover{background:#3a4636}
  .cell.me{background:#4a3f1c !important;box-shadow:inset 0 0 0 2px var(--gold);color:#ffe9a8}
  .unit{position:absolute;inset:1px;border-radius:3px;display:flex;align-items:center;justify-content:center;
    font-size:10px;color:#07110b;font-weight:700}
  .unit.ally{background:var(--ally)}
  .unit.merchant{background:var(--merchant)}
  .unit.enemy{background:var(--enemy)}
  .unit.neutral{background:#9aa6b3}
  .loc-dot{position:absolute;right:2px;top:2px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);justify-content:center}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
  .hint{font-size:12px;color:var(--muted);text-align:center}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .stack{display:flex;flex-direction:column;gap:10px}
  .ally{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel-2)}
  .ally .name{color:var(--ally);font-weight:600}
  .ally .meta{font-size:12px;color:var(--muted)}
  .tag{font-size:11px;padding:1px 6px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
  .log{max-height:220px;overflow:auto;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
  .log div{color:#a9b4c1}
  .log div.err{color:#f0a49c}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#20272f;
    border:1px solid var(--line);border-left:3px solid var(--gold);padding:9px 14px;border-radius:8px;
    max-width:80vw;opacity:0;pointer-events:none;transition:.2s;z-index:30;white-space:pre-wrap}
  #toast.show{opacity:1}
  .modal{position:fixed;inset:0;background:rgba(6,9,12,.82);display:flex;align-items:center;
    justify-content:center;z-index:20;padding:18px}
  .modal.hidden{display:none}
  .modal .card{width:min(520px,100%);background:var(--panel)}
  .field{display:flex;align-items:center;gap:8px;margin:7px 0}
  .field label{width:82px;color:var(--muted);font-size:13px}
  .field input[type=number]{width:74px}
  .field input[type=text],.field select{flex:1}
  .attrs{display:flex;gap:8px}
  .attrs .field{margin:0;flex:1}
  .attrs .field label{width:auto}
  .attrs input{width:100%}
  .combatant{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0;
    border-bottom:1px dashed #232c36}
  .combatant.dead{opacity:.45;text-decoration:line-through}
  .combatant .hp{color:var(--muted);font-variant-numeric:tabular-nums}
  .side-enemy .name{color:var(--enemy)}
  .side-player .name{color:var(--ally)}
  .hits{display:flex;flex-direction:column;gap:4px;margin:8px 0}
  .hit{display:grid;grid-template-columns:64px 1fr;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
  .hit input{width:100%}
  details{border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
  summary{cursor:pointer;color:var(--muted);font-size:12px}
  textarea{width:100%;min-height:88px;background:#0f141a;color:var(--text);border:1px solid var(--line);
    border-radius:6px;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;padding:6px}
  .kv{font-size:12.5px;color:var(--muted)}
  .kv b{color:var(--text);font-weight:500}
  .banner{border:1px solid #6d5a2a;background:#241f14;color:#f2d99a;border-radius:8px;padding:8px 10px;
    font-size:13px;margin-bottom:10px}
  .banner.dead{border-color:#5c2b27;background:#241716;color:#f0a49c}
</style>
</head>
<body>
<header>
  <h1>临济 · 永恒黄昏</h1>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <button id="newBtn">新开一局</button>
</header>

<main>
  <section class="stack">
    <div class="card">
      <h2>地图 <span id="turnLabel"></span></h2>
      <div class="mapwrap">
        <div id="map"></div>
        <div class="legend">
          <span><i style="background:#4a3f1c;box-shadow:inset 0 0 0 1px #d8b45a"></i>你</span>
          <span><i style="background:#6fca94"></i>朋友/员工</span>
          <span><i style="background:#e2645a"></i>敌意单位</span>
          <span><i style="background:#e0c060"></i>商人</span>
          <span><i style="background:#2a323c"></i>已知地形</span>
          <span><i style="background:#12161b"></i>迷雾</span>
        </div>
        <div class="row">
          <button id="waitBtn">等待 1 回合</button>
          <button id="wait5Btn">等待 5 回合</button>
          <span class="hint">点相邻格 / WASD、方向键移动 · 每步都会推进世界时间</span>
        </div>
        <div id="posLabel" class="hint"></div>
      </div>
    </div>

    <div class="card" id="eventCard" style="display:none">
      <h2>事件 <span id="eventName"></span></h2>
      <div id="eventBody" class="stack"></div>
    </div>

    <div class="card" id="battleCard" style="display:none">
      <h2>战斗 <span id="battlePhase"></span></h2>
      <div id="battleBody" class="stack"></div>
    </div>

    <div class="card">
      <h2>世界事实 <span>最近 18 条</span></h2>
      <div class="log" id="facts"></div>
    </div>
  </section>

  <aside class="stack">
    <div class="card" id="overCard" style="display:none">
      <h2>结局</h2>
      <div id="overBody" class="kv"></div>
    </div>

    <div class="card">
      <h2>同伴 <span id="allyCount"></span></h2>
      <div id="allies" class="stack"><div class="hint">暂无同伴</div></div>
    </div>

    <div class="card">
      <h2>附近单位 <span id="nearLabel"></span></h2>
      <div id="near" class="stack"><div class="hint">相邻格没有可交涉单位</div></div>
    </div>

    <div class="card">
      <h2>已知地点 <span id="locCount"></span></h2>
      <div id="locations" class="kv"></div>
    </div>

    <div class="card">
      <h2>行动记录</h2>
      <div class="log" id="log"></div>
      <details>
        <summary>高级指令（直接提交任意引擎 action）</summary>
        <div class="stack" style="margin-top:8px">
          <input id="rawAction" placeholder="action，例如 use_daowen / cast / consume_item" />
          <textarea id="rawParams">{}</textarea>
          <button id="rawSend">提交</button>
          <div class="hint" style="text-align:left">按引擎真实接口提交；用于施法、使用道纹、消耗品等界面未做专用控件的操作。</div>
        </div>
      </details>
    </div>
  </aside>
</main>

<div class="modal" id="newModal">
  <div class="card">
    <h2>开局 <span>25 点属性自由分配</span></h2>
    <div class="field"><label>名字</label><input id="fName" type="text" value="轮回者" maxlength="12" /></div>
    <div class="field"><label>副本</label>
      <select id="fRegion">
        <option>罪孽都市</option><option>扭曲都市</option><option>龙心谷</option><option>乱葬岗</option>
      </select>
    </div>
    <div class="field"><label>属性</label>
      <div class="attrs">
        <div class="field"><label>血</label><input id="fBlood" type="number" value="11" min="1" max="23" /></div>
        <div class="field"><label>速</label><input id="fSpeed" type="number" value="8" min="1" max="23" /></div>
        <div class="field"><label>法</label><input id="fMana" type="number" value="6" min="1" max="23" /></div>
      </div>
    </div>
    <div class="field"><label>地图</label>
      <select id="fSize">
        <option value="21">21 × 21（完整副本，含其他轮回者）</option>
        <option value="13">13 × 13（小地图，只有怪物）</option>
      </select>
    </div>
    <div class="field"><label>同伴</label>
      <label style="width:auto;color:var(--text)"><input id="fFriend" type="checkbox" checked /> 开局带一名随行朋友（可体验建议系统）</label>
    </div>
    <div class="row" style="margin-top:12px;justify-content:flex-end">
      <button id="startBtn" class="primary">进入副本</button>
    </div>
    <div class="hint" style="text-align:left;margin-top:8px">
      开局自动选择发现的第一件遗物与第一枚道纹，共鸣取「转换」；之后一切判定仍由引擎完成。
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const TERRAIN_LABEL = {floor:"", wall:"#", water:"~", void:" "};
const BEHAVIOR_LABEL = {follow:"跟随你", guard:"守点", explore:"自行探索"};
const SUGGESTIONS = [
  ["follow","建议：跟着我"], ["guard","建议：守在这里"],
  ["explore","建议：自己去探索"], ["hold","建议：原地待命"],
];
let S = null;
let busy = false;

const $ = (id) => document.getElementById(id);
function el(tag, cls, text){ const n = document.createElement(tag); if(cls) n.className = cls;
  if(text !== undefined && text !== null) n.textContent = text; return n; }

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 4200);
}

async function api(path, body){
  const res = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body || {})});
  const data = await res.json();
  if (data.snapshot) { S = data.snapshot; render(); }
  return data;
}

async function act(action, params){
  if (busy) return; busy = true;
  try {
    const data = await api("/api/action", {action, params: params || {}});
    const r = data.result || {};
    if (!data.success) toast(`失败：${r.error || "未知错误"}`);
    else if (r.result && typeof r.result === "object") {
      const s = summarize(action, r.result);
      if (s) toast(s);
    }
  } catch(e){ toast("请求失败：" + e.message); }
  finally { busy = false; }
}

function summarize(action, result){
  if (action === "world_suggest_ally"){
    return `${result.target}${result.accepted ? "接受了" : "拒绝了"}「${result.suggestion}」` +
      `（采纳率 ${result.chance_percent}%，当前：${BEHAVIOR_LABEL[result.behavior] || result.behavior}）`;
  }
  if (action === "world_interact") return `${result.target}：${result.choice}`;
  if (action === "world_move") return "已移动";
  if (action === "resolve_attack"){
    const d = (result.hits||[]).map(h=>h.damage_dealt);
    return `攻击落地：${d.join(" / ")}`;
  }
  if (action === "resolve_monster_phase") return `敌方阶段结算，你的生命 ${result.player_hp}`;
  return "";
}

function render(){
  renderHeader(); renderMap(); renderAllies(); renderNear(); renderLocations();
  renderEvent(); renderBattle(); renderLog(); renderFacts(); renderOver();
}

function renderHeader(){
  const p = S && S.player;
  const box = $("stats"); box.innerHTML = "";
  if (!p) return;
  const hpPct = Math.max(0, Math.min(100, 100 * p.hp / Math.max(1, p.hp_limit)));
  const mpPct = Math.max(0, Math.min(100, 100 * p.mana / Math.max(1, p.mana_limit)));
  box.append(
    el("span", "stat", `生命 `), (()=>{const d=el("span","stat");const b=el("div","bar");const i=el("i");i.style.width=hpPct+"%";b.append(i);
      d.append(b, el("b", null, ` ${p.hp}/${p.hp_limit}`)); return d;})(),
    (()=>{const d=el("span","stat");const b=el("div","bar mana");const i=el("i");i.style.width=mpPct+"%";b.append(i);
      d.append(b, el("b", null, ` ${p.mana}/${p.mana_limit}`)); return d;})(),
    el("span","stat", `速 ${p.speed}/${p.speed_limit}`),
    el("span","stat", `碎片 ${p.shards}`),
    el("span","stat", `精力 ${p.energy}`),
    el("span","stat", `遗物 ${p.relics.length} · 道纹 ${p.daowen.length}`),
    el("span","stat", `副本 ${p.region || ""}`),
  );
  const w = S.world;
  const ended = !!((w && w.ended) || (w && w.final_duel && w.final_duel.complete));
  $("waitBtn").disabled = ended;
  $("wait5Btn").disabled = ended;
  $("turnLabel").textContent = w
    ? (ended ? `第 ${w.world_turn} 回合 · 本局已结束` : `第 ${w.world_turn} 回合 · 膨胀圈 ${w.boundary.shrunk_rings}`)
    : "";
  if (ended) $("posLabel").textContent = "结局已出：胜者离开副本。";
  else $("posLabel").textContent = (w && w.self)
    ? `你位于 (${w.self.position[0]}, ${w.self.position[1]}) · 建议范围 ${w.suggestion_range} 格`
    : (w && w.stale ? "事件待结算，地图冻结" : "");
}

function renderMap(){
  const map = $("map"); map.innerHTML = "";
  const w = S && S.world;
  if (!w || !w.self) return;
  const size = Math.max(16, Math.min(28, Math.floor(620 / Math.max(w.map_size.width, w.map_size.height))));
  map.style.gridTemplateColumns = `repeat(${w.map_size.width}, ${size}px)`;
  const terrain = new Map((w.known_terrain||[]).map(t => [`${t.x},${t.y}`, t.terrain]));
  const visible = new Set((w.visible_cells||[]).map(c => `${c[0]},${c[1]}`));
  const locs = new Map();
  for (const loc of (w.known_locations||[])){
    if (loc.position && loc.position[0] !== null) locs.set(`${loc.position[0]},${loc.position[1]}`, loc);
  }
  const actors = new Map();
  for (const a of (w.visible_actors||[])) actors.set(`${a.position[0]},${a.position[1]}`, a);
  for (const a of (w.allies||[])) actors.set(`${a.position[0]},${a.position[1]}`, a);
  const [px, py] = w.self.position;
  const isWall = (x,y) => terrain.get(`${x},${y}`) === "wall";
  for (let y = 0; y < w.map_size.height; y++){
    for (let x = 0; x < w.map_size.width; x++){
      const key = `${x},${y}`;
      const cell = el("div", "cell");
      cell.style.width = cell.style.height = size + "px";
      cell.style.fontSize = Math.max(9, Math.floor(size*0.44)) + "px";
      const t = terrain.get(key);
      if (t !== undefined){
        cell.classList.add("known");
        if (t === "wall") cell.classList.add("wall");
        else if (t === "water") cell.classList.add("water");
        const loc = locs.get(key);
        if (loc){
          cell.classList.add(loc.kind || "event");
          cell.title = loc.name + (loc.description ? "：" + loc.description : "");
          cell.append(el("span", "loc-dot"));
        } else {
          cell.textContent = TERRAIN_LABEL[t] ?? "";
        }
        if (visible.has(key)) cell.classList.add("visible");
      } else if (visible.has(key)){
        cell.classList.add("known", "visible");
      }
      if (!w.ended && Math.abs(x-px) + Math.abs(y-py) === 1 && terrain.has(key) && !isWall(x,y)){
        cell.classList.add("reachable");
        cell.title = "走到这里";
        cell.onclick = () => act("world_move", {x, y});
      }
      const actor = actors.get(key);
      if (actor){
        const unit = el("div", "unit " + unitClass(actor), (actor.name||"?").slice(0,1));
        unit.title = `${actor.name}（${actor.kind || ""}）`;
        if (actor.actor_id === w.self.actor_id) unit.classList.add("me");
        cell.append(unit);
      }
      if (x === px && y === py){
        cell.classList.add("me");
        cell.title = "你";
        if (!actor) cell.textContent = "我";
      }
      map.append(cell);
    }
  }
}

function unitClass(actor){
  if (actor.actor_id && S.world && actor.actor_id === S.world.self.actor_id) return "";
  if (["friend","employee","temp_friend"].includes(actor.kind)) return "ally";
  if (actor.kind === "merchant") return "merchant";
  if (actor.kind === "enemy") return "enemy";
  return "neutral";
}

function renderAllies(){
  const box = $("allies"); box.innerHTML = "";
  const allies = (S && S.world && S.world.allies) || [];
  $("allyCount").textContent = allies.length ? `${allies.length} 人` : "";
  if (!allies.length){ box.append(el("div","hint","暂无同伴")); return; }
  const self = S.world && S.world.self;
  const [px, py] = self ? self.position : [0, 0];
  for (const a of allies){
    const card = el("div","ally");
    const dist = Math.abs(a.position[0]-px) + Math.abs(a.position[1]-py);
    const head = el("div","row");
    head.append(el("span","name",a.name), el("span","tag", BEHAVIOR_LABEL[a.behavior] || a.behavior));
    if (a.guard_position) head.append(el("span","tag",`守点 ${a.guard_position[0]},${a.guard_position[1]}`));
    card.append(head, el("div","meta", `位置 (${a.position[0]}, ${a.position[1]}) · 距离 ${dist} 格`));
    if (dist > (S.world.suggestion_range || 5)){
      card.append(el("div","meta", `超出建议范围 ${S.world.suggestion_range} 格，说了它也听不见`));
    }
    const row = el("div","row"); row.style.marginTop = "6px";
    for (const [value, label] of SUGGESTIONS){
      const b = el("button", value === "explore" ? "" : "", label);
      b.disabled = dist > (S.world.suggestion_range || 5);
      b.onclick = () => act("world_suggest_ally", {target_actor_id: a.actor_id, suggestion: value});
      row.append(b);
    }
    card.append(row, el("div","meta","它自己决定听不听；拒绝时行为保持不变。"));
    box.append(card);
  }
}

function renderNear(){
  const box = $("near"); box.innerHTML = "";
  const w = S && S.world;
  $("nearLabel").textContent = "";
  if (!w || !w.self) return;
  const [px, py] = w.self.position;
  const near = (w.visible_actors || []).filter(a =>
    Math.abs(a.position[0]-px) + Math.abs(a.position[1]-py) === 1);
  if (!near.length){ box.append(el("div","hint","相邻格没有可交涉单位")); return; }
  for (const a of near){
    const row = el("div","ally");
    row.append(el("div","name", `${a.name}`), el("div","meta", `${a.kind} · (${a.position[0]}, ${a.position[1]})`));
    const btns = el("div","row"); btns.style.marginTop="6px";
    for (const [choice, label, cls] of [["talk","交谈"],["trade","交易"],["cooperate","合作"],
                                        ["intimidate","威吓"],["attack","动手","danger"]]){
      const b = el("button", cls || "", label);
      b.onclick = () => act("world_interact", {target_actor_id: a.actor_id, choice});
      btns.append(b);
    }
    row.append(btns);
    box.append(row);
  }
}

function renderLocations(){
  const box = $("locations"); box.innerHTML = "";
  const locs = (S && S.world && S.world.known_locations) || [];
  $("locCount").textContent = locs.length ? `${locs.length} 处` : "";
  if (!locs.length){ box.append(el("div","hint","还没发现地点")); return; }
  for (const loc of locs.slice(0, 12)){
    const d = el("div");
    const where = loc.position && loc.position[0] !== null ? `(${loc.position[0]}, ${loc.position[1]})` : "位置未知";
    d.append(el("b", null, loc.name), document.createTextNode(` · ${loc.kind} ${where}${loc.active === false ? " · 已失效" : ""}`));
    if (loc.description) d.append(el("div","hint", loc.description));
    box.append(d);
  }
}

function fieldInput(field){
  const hint = field.hint;
  let input;
  if (Array.isArray(hint)){
    input = el("select");
    for (const v of hint) { const o = el("option", null, String(v)); o.value = String(v); input.append(o); }
  } else if (hint && typeof hint === "object") {
    const raw = hint.items || hint;
    input = el("select");
    for (const v of (Array.isArray(raw) ? raw : Object.keys(raw))){
      const o = el("option", null, String(v)); o.value = String(v); input.append(o);
    }
  } else if (typeof hint === "number" || /integer|positive integer|数字|数量/i.test(String(hint))){
    input = el("input"); input.type = "number"; input.step = "1";
  } else if (/boolean|布尔/i.test(String(hint))){
    input = el("select"); const y = el("option", null, "true"); y.value = "true";
    const n = el("option", null, "false"); n.value = "false"; input.append(y, n);
  } else {
    input = el("input"); input.type = "text";
  }
  input.dataset.key = field.key;
  input.dataset.hint = String(hint && typeof hint === "object" ? "object" : hint);
  return input;
}

function collectFields(container){
  const out = {};
  for (const input of container.querySelectorAll("[data-key]")){
    const key = input.dataset.key;
    if (input.value === "" || input.value === undefined) continue;
    if (input.dataset.hint === "object"){
      try { out[key] = JSON.parse(input.value); } catch(e) { out[key] = input.value; }
    } else if (input.type === "number"){
      out[key] = Number(input.value);
    } else if (input.value === "true" || input.value === "false"){
      out[key] = input.value === "true";
    } else {
      out[key] = input.value;
    }
  }
  return out;
}

function renderEvent(){
  const card = $("eventCard"), body = $("eventBody");
  body.innerHTML = "";
  if (!S || !S.event){ card.style.display = "none"; return; }
  card.style.display = "";
  $("eventName").textContent = S.event.name;
  if (S.world && S.world.stale){
    body.append(el("div","banner","事件待结算：地图暂时冻结，先做选择。"));
  }
  if (S.event.desc) body.append(el("div","kv", S.event.desc));
  for (const opt of S.event.options){
    const wrap = el("div","ally");
    wrap.append(el("div","name", opt.text || `选项 ${opt.option_id}`));
    const row = el("div","row"); row.style.marginTop = "6px";
    for (const f of opt.fields){
      const box = el("div","field"); box.style.margin = "0";
      box.append(el("label", null, f.key), fieldInput(f));
      row.append(box);
    }
    const extra = el("input");
    extra.type = "text";
    extra.placeholder = "附加参数 JSON（可选，例如 {\"resonance_type\":\"转换\"}）";
    extra.style.flex = "1";
    const send = el("button","primary","确认");
    send.onclick = () => {
      const params = {event: S.event.name, option_id: opt.option_id, confirmed: true};
      Object.assign(params, collectFields(row));
      const raw = extra.value.trim();
      if (raw){
        try { Object.assign(params, JSON.parse(raw)); }
        catch(e){ toast("附加参数不是合法 JSON"); return; }
      }
      act("resolve_event", params);
    };
    row.append(send);
    wrap.append(row, extra);
    body.append(wrap);
  }
  if (S.event.queued) body.append(el("div","hint", `还有 ${S.event.queued} 个事件排队`));
}

function renderBattle(){
  const card = $("battleCard"), body = $("battleBody");
  body.innerHTML = "";
  const w = S && S.world, b = S && S.battle;
  if (!S) return;
  if (w && w.encounter_for_player && S.phase === "pre_battle"){
    card.style.display = "";
    $("battlePhase").textContent = "地图遭遇";
    const btns = el("div","row");
    const start = el("button","primary","进入战斗");
    start.onclick = () => act("battle_start", {world_encounter_id: w.encounter_for_player.encounter_id});
    btns.append(start);
    body.append(el("div","banner","遭遇已发生：这场架躲不开，只能决定怎么打。"), btns);
    return;
  }
  if (!b){ card.style.display = "none"; return; }
  card.style.display = "";
  $("battlePhase").textContent = b.peaceful ? "战斗结束" : `第 ${b.round} 回合 · ${b.subphase}`;
  for (const c of b.combatants){
    const row = el("div", "combatant " + (c.side === "enemy" ? "side-enemy" : "side-player")
      + (c.alive ? "" : " dead"));
    const combat = (c.attack_count > 0) ? ` · 攻 ${c.attack_count}×${c.attack_power}` : "";
    row.append(el("span","name", c.name), el("span","hp", `${c.hp}/${c.hp_limit}${combat}`));
    body.append(row);
  }
  if (!S.player || !S.player.alive){
    body.append(el("div","banner dead","你已倒下，这一局的胜负由世界继续写下去。"));
    return;
  }
  const avail = (S.actions && S.actions.actions || []).map(a => a.action_type);
  const has = (name) => avail.includes(name);
  const row = el("div","row"); row.style.marginTop = "8px";

  const endBtn = () => {
    const b2 = el("button","primary","结算战斗，回到地图");
    b2.onclick = () => act("battle_end", {});
    return b2;
  };
  const roundEndBtn = () => {
    const b2 = el("button","primary","结算本回合");
    b2.onclick = () => act("round_end", {});
    return b2;
  };
  const roundStartBtn = () => {
    const b2 = el("button","primary","开始本回合");
    b2.onclick = () => act("round_start", {relic_choices: {}});
    return b2;
  };
  const allyBtn = () => {
    const b2 = el("button","", "让同伴自主行动一次");
    b2.onclick = () => act("resolve_ally_phases", {});
    return b2;
  };
  const monsterBtn = (dodgeBoxes) => {
    const b2 = el("button","", "结束我方行动，结算敌方阶段");
    b2.onclick = async () => {
      if (busy) return; busy = true;
      try {
        const refs = dodgeBoxes.filter(cb => cb.checked).map(cb => cb.dataset.ref);
        const data = await api("/api/ui_monster_phase", {dodge_refs: refs});
        if (!data.success) toast("敌方阶段失败：" + (data.result && data.result.error));
        else toast("敌方阶段已结算");
      } finally { busy = false; }
    };
    return b2;
  };

  if (b.peaceful){
    row.append(endBtn());
    body.append(row);
    return;
  }
  if (b.pending_attack){
    const pa = b.pending_attack;
    const targetSelect = el("select");
    for (const t of pa.target_options){
      const o = el("option", null, `${t.name}（${t.ref}）`); o.value = t.ref; targetSelect.append(o);
    }
    const trow = el("div","field"); trow.append(el("label",null,"目标"), targetSelect);
    body.append(trow);
    const hitsBox = el("div","hits");
    const per = Math.floor(pa.damage_budget / Math.max(1, pa.hit_count));
    const inputs = [];
    for (let i = 0; i < pa.hit_count; i++){
      const line = el("div","hit");
      line.append(el("span",null,`第 ${i+1} 击`));
      const input = el("input"); input.type = "number"; input.min = "0"; input.step = "1";
      input.value = i === pa.hit_count - 1 ? pa.damage_budget - per * (pa.hit_count - 1) : per;
      line.append(input); inputs.push(input); hitsBox.append(line);
    }
    const go = el("button","primary","提交攻击");
    go.onclick = async () => {
      if (busy) return; busy = true;
      try {
        const data = await api("/api/ui_attack", {target_ref: targetSelect.value,
          damages: inputs.map(i => Number(i.value) || 0)});
        if (!data.success) toast("攻击失败：" + (data.result && data.result.error));
        else toast("攻击已结算");
      } finally { busy = false; }
    };
    body.append(hitsBox, el("div","kv", `总伤害上限 ${pa.damage_budget} · ${pa.hit_count} 击`));
    row.append(go);
    body.append(row);
    return;
  }

  const dodgeBoxes = [];
  if (has("prepare_attack")){
    const prep = el("button","primary","准备攻击");
    prep.onclick = () => act("prepare_attack", {actor_ref: "player:0"});
    row.append(prep);
  }
  if (has("resolve_ally_phases")) row.append(allyBtn());
  if (has("prepare_monster_phase")) row.append(monsterBtn(dodgeBoxes));
  if (has("round_end")) row.append(roundEndBtn());
  if (has("round_start")) row.append(roundStartBtn());
  if (has("battle_end")) row.append(endBtn());
  body.append(row);

  const foes = (b.combatants || []).filter(c => c.side === "enemy" && c.alive && c.ref);
  if (foes.length && has("prepare_monster_phase")){
    const dodgeWrap = el("div","kv");
    dodgeWrap.append(document.createTextNode("敌方阶段尝试闪避："));
    foes.forEach((c) => {
      const lab = el("label"); lab.style.marginRight = "10px";
      const cb = el("input"); cb.type = "checkbox";
      cb.dataset.ref = c.ref; dodgeBoxes.push(cb);
      lab.append(cb, document.createTextNode(" " + c.name));
      dodgeWrap.append(lab);
    });
    body.append(dodgeWrap);
  }
  if (!avail.length) body.append(el("div","hint","引擎当前没有可选战斗行动"));
}

function renderLog(){
  const box = $("log"); box.innerHTML = "";
  for (const line of (S.log || []).slice().reverse()){
    box.append(el("div", line.startsWith("✗") ? "err" : "", line));
  }
}

function renderFacts(){
  const box = $("facts"); box.innerHTML = "";
  const facts = (S.world && S.world.facts) || [];
  if (!facts.length){ box.append(el("div","hint","世界还没有留下事实")); return; }
  for (const f of facts.slice().reverse()){
    const d = f.details || {};
    let text = f.type;
    if (f.type === "ally_suggestion_made") text = `建议 ${d.target_name}「${d.suggestion}」→ ${d.accepted ? "接受" : "拒绝"}（${d.chance_percent}%）`;
    else if (f.type === "ally_suggestion_accepted") text = `${d.suggestion} 被接受，行为改为 ${d.behavior}`;
    else if (f.type === "ally_suggestion_rejected") text = `拒绝建议，保持 ${d.kept_behavior}`;
    else if (f.type === "encounter_started") text = "遭遇爆发";
    else if (f.type === "actor_moved") text = `${d.name || "单位"} 移动`;
    else if (f.type === "location_discovered") text = `发现地点 ${d.name || d.location_id || ""}`;
    else if (f.type === "battle_resolved") text = `战斗结果 ${d.outcome || ""}`;
    else if (Object.keys(d).length) text += " · " + JSON.stringify(d).slice(0, 90);
    box.append(el("div", null, `[${f.world_turn}] ${text}`));
  }
}

function renderOver(){
  const card = $("overCard"), body = $("overBody");
  if (!S.world || !S.world.final_duel || !S.world.final_duel.complete){
    card.style.display = "none"; return;
  }
  card.style.display = "";
  const fd = S.world.final_duel;
  body.innerHTML = "";
  body.append(el("div", null, `胜者：${fd.winner_name || fd.winner || "未知"}`));
  body.append(el("div", "hint", "最终生存阶段已结束；胜者离开副本。"));
}

document.addEventListener("keydown", (e) => {
  if (!S || !S.world || document.querySelector(".modal:not(.hidden)")) return;
  if (["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)) return;
  const map = {ArrowUp:[0,-1], w:[0,-1], W:[0,-1], ArrowDown:[0,1], s:[0,1], S:[0,1],
               ArrowLeft:[-1,0], a:[-1,0], A:[-1,0], ArrowRight:[1,0], d:[1,0], D:[1,0]};
  const delta = map[e.key];
  if (!delta) return;
  e.preventDefault();
  const [px, py] = S.world.self.position;
  act("world_move", {x: px + delta[0], y: py + delta[1]});
});

$("waitBtn").onclick = () => act("world_wait", {turns: 1});
$("wait5Btn").onclick = () => act("world_wait", {turns: 5});
$("newBtn").onclick = () => $("newModal").classList.remove("hidden");
$("rawSend").onclick = () => {
  let params = {};
  try { params = JSON.parse($("rawParams").value || "{}"); }
  catch(e){ toast("参数不是合法 JSON"); return; }
  const action = $("rawAction").value.trim();
  if (!action) { toast("先填写 action"); return; }
  act(action, params);
};

async function startGame(){
  const blood = Number($("fBlood").value), speed = Number($("fSpeed").value), mana = Number($("fMana").value);
  if (blood + speed + mana !== 25){ toast(`属性总和必须是 25，当前 ${blood+speed+mana}`); return; }
  const size = Number($("fSize").value);
  $("startBtn").disabled = true;
  try {
    const res = await fetch("/api/new", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({name:$("fName").value || "轮回者", region:$("fRegion").value,
        blood_points:blood, speed_points:speed, mana_points:mana,
        demo_friend:$("fFriend").checked, width:size, height:size})});
    const data = await res.json();
    if (!data.success){ toast("开局失败：" + (data.error || "未知错误")); return; }
    S = data.snapshot; $("newModal").classList.add("hidden"); render();
    toast("世界已生成：先走走看，同伴会自己跟着你。");
  } catch(e){ toast("开局请求失败：" + e.message); }
  finally { $("startBtn").disabled = false; }
}
$("startBtn").onclick = startGame;

(async function boot(){
  try {
    const res = await fetch("/api/snapshot");
    S = await res.json();
    if (S.started) { $("newModal").classList.add("hidden"); render(); }
  } catch(e){ /* 首屏失败时保留开局弹窗 */ }
})();
</script>
