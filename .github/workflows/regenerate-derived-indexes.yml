name: Regenerate derived project indexes

on:
  pull_request:
    branches: [main]
    paths:
      - "规则正文.md"
      - "全道纹索引.md"
      - "sim/gen_daowen_index.py"
      - "sim/gen_ai_context.py"
      - "engine/derivatives.py"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Regenerate derived DaoWen index and AI context
        run: |
          python sim/gen_daowen_index.py
          python sim/gen_ai_context.py

      - name: Commit generated files to this PR branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- 全道纹索引.md AI_CONTEXT.md; then
            echo "Generated files are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 全道纹索引.md AI_CONTEXT.md
          git commit -m "Regenerate derived DaoWen index and AI context"
          git push origin "HEAD:$BRANCH"
