name: Regenerate derived documentation

on:
  push:
    branches: [feat/open-world-core]
    paths:
      - .github/workflows/regenerate-derived-docs.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project tooling
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Regenerate source-derived documents
        run: |
          python sim/gen_rules.py
          python sim/gen_ai_context.py
      - name: Commit generated documents when changed
        run: |
          git add -- "死者之书.md" "AI_CONTEXT.md"
          if git diff --cached --quiet; then
            echo "Generated documents already match their sources."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate derived rule and AI context files"
          git push
