name: Temporary AI context regeneration

on:
  push:
    branches:
      - feature/issue-95-custom-resource-extensions

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate AI_CONTEXT from its authoritative sources
        run: |
          python3 sim/gen_ai_context.py
          python3 sim/gen_ai_context.py --check

      - name: Commit generated output if changed
        run: |
          if git diff --quiet -- AI_CONTEXT.md; then
            echo "AI_CONTEXT.md already matches its sources"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_CONTEXT.md
          git commit -m "docs: regenerate AI context from sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"
