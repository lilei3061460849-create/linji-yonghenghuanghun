name: Open-world full playthrough replay

on:
  pull_request:
    paths:
      - "sim/run_open_world_replay.py"
      - ".github/workflows/open-world-full-replay.yml"
      - "engine/**"
      - "sim/produce_real_winners.py"
  push:
    branches: [main]
    paths:
      - "sim/run_open_world_replay.py"
      - ".github/workflows/open-world-full-replay.yml"
      - "engine/**"
      - "sim/produce_real_winners.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Remove stale replay outputs
        run: |
          rm -f data/open_world_replay/open_world_full_replay.json data/open_world_replay/open_world_full_replay.md
          mkdir -p artifacts/open_world_replay
      - name: Run one deterministic open-world playthrough through existing combat
        run: set -o pipefail && python sim/run_open_world_replay.py 2>&1 | tee artifacts/open_world_replay/run.log
      - name: Audit real resource, relic, hiring, and event integrations
        if: always()
        run: |
          set -o pipefail
          python -m pytest -q tests/test_open_world.py -k "arriving_at_event_location or resource_location_is_collected_once or world_resonance_drops_a_real_relic or player_picks_up_resonance_relic or hiring_signal_persists_while_player_moves" --junitxml=artifacts/open_world_replay/location-feature-audit.xml 2>&1 | tee artifacts/open_world_replay/location-feature-audit.txt
      - name: Upload complete world and combat replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-world-full-replay-seed-1
          path: |
            data/open_world_replay/open_world_full_replay.json
            data/open_world_replay/open_world_full_replay.md
            artifacts/open_world_replay/run.log
            artifacts/open_world_replay/location-feature-audit.xml
            artifacts/open_world_replay/location-feature-audit.txt
          if-no-files-found: warn
          retention-days: 30
