name: Tests

on:
  push:
    branches: [main, feat/open-world-core]
  pull_request:
  workflow_dispatch:

concurrency:
  group: open-world-tests-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.12 是主版本；3.11 是 pyproject.toml 声明的最低支持版本（最低版本检查）。
        # 只要 pyproject 的 requires-python 上调，这里的最低版本也必须同步上调。
        python-version: ["3.12", "3.11"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run the full test suite
        # 全量约 2~3 分钟。历史上这里只跑 14 个文件，导致"CI 绿但仓库红"，
        # 已改为默认全量；不再需要 workflow_dispatch 的 full_suite 开关。
        run: python -m pytest -q
