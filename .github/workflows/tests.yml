name: Tests

on:
  push:
    branches: [main, feat/open-world-core]
  pull_request:
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Run every legacy test, including unrelated known failures"
        type: boolean
        required: false
        default: false

concurrency:
  group: open-world-tests-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run open-world and preference regressions
        if: github.event_name != 'workflow_dispatch' || inputs.full_suite != 'true'
        run: python -m pytest -q tests/test_open_world.py tests/test_monster_preferences.py tests/test_altar.py tests/test_relicization_behavior_boundaries.py tests/test_real_winner_generator.py

      - name: Run full repository suite on demand
        if: (github.event_name == 'workflow_dispatch' && inputs.full_suite == 'true') || github.event_name == 'push' || github.event_name == 'pull_request'
        run: python -m pytest -q
