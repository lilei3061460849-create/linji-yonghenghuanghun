name: One-off real winner sample generation

on:
  push:
    branches: [main, ops/real-winner-samples]
    paths:
      - "sim/produce_real_winners.py"
      - "tests/test_real_winner_generator.py"
      - ".github/workflows/real-winner-samples.yml"
  workflow_dispatch:

permissions:
  # Artifacts only; generated snapshots are reviewed before committing.
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Generate real first-tier winners
        env:
          REAL_WINNER_DIR: artifacts/real_winners
        run: python sim/produce_real_winners.py --count 3 --max-games 500

      - name: Upload winner snapshots for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-winner-samples
          path: artifacts/real_winners/**
          if-no-files-found: error
