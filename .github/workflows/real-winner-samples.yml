name: One-off real winner sample generation

on:
  push:
    branches: [main, ops/real-winner-samples]
    paths:
      - "sim/produce_open_world_winners.py"
      - "sim/run_open_world_replay.py"
      - ".github/workflows/real-winner-samples.yml"
  workflow_dispatch:

concurrency:
  group: real-winner-samples-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Artifacts only; generated snapshots are reviewed before committing.
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Prepare isolated sample output
        run: rm -rf artifacts/real_winners && mkdir -p artifacts/real_winners

      - name: Generate real first-tier winners from complete open-world runs
        env:
          REAL_WINNER_DIR: artifacts/real_winners
        run: set -o pipefail && python sim/produce_open_world_winners.py --count 3 --max-games 50 2>&1 | tee artifacts/real_winners/run.log

      - name: Upload winner snapshots for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-winner-samples
          path: artifacts/real_winners/**
          if-no-files-found: error
