name: Random reincarnator PvP lab

on:
  pull_request:
    branches: [main]
    paths:
      - "sim/audits/random_pvp_lab.py"
      - ".github/workflows/random-pvp-lab.yml"
      - "engine/**"
      - "sim/duel_pvp.py"
      - "sim/win_only_ai.py"
  push:
    branches: [feature/fengjian-1-4-random-pvp-20261118]
    paths:
      - "sim/audits/random_pvp_lab.py"
      - ".github/workflows/random-pvp-lab.yml"
      - "engine/**"
      - "sim/duel_pvp.py"
      - "sim/win_only_ai.py"
  workflow_dispatch:
    inputs:
      runs:
        description: "Number of randomized duels"
        required: true
        default: "1"
        type: string
      seed:
        description: "First deterministic seed"
        required: true
        default: "20261118"
        type: string

permissions:
  contents: read

jobs:
  random-pvp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run real-engine randomized PvP
        env:
          RUNS: ${{ github.event.inputs.runs || '1' }}
          SEED: ${{ github.event.inputs.seed || '20261118' }}
        run: |
          python sim/audits/random_pvp_lab.py \
            --runs "$RUNS" \
            --seed "$SEED" \
            --max-rounds 40 \
            --max-wall-seconds 30 \
            --output-dir artifacts/random-pvp

      - name: Upload battle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: random-pvp-${{ github.run_number }}
          path: artifacts/random-pvp/
          if-no-files-found: warn
          retention-days: 30
