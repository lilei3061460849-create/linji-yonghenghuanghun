name: Random reincarnator PvP lab

on:
  pull_request:
    branches: [main]
    paths:
      - "sim/audits/random_pvp_lab.py"
      - "sim/random_pvp_support.py"
      - "tests/test_random_pvp_lab.py"
      - ".github/workflows/random-pvp-lab.yml"
      - "engine/**"
      - "sim/duel_pvp.py"
      - "sim/win_only_ai.py"
  workflow_dispatch:
    inputs:
      runs:
        description: "Number of randomized duels"
        required: true
        default: "30"
        type: string
      seed:
        description: "First deterministic seed"
        required: true
        default: "20261118"
        type: string

permissions:
  contents: write

jobs:
  random-pvp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Regenerate derived indexes and AI context
        run: |
          python sim/gen_daowen_index.py
          python sim/gen_ai_context.py

      - name: Commit generated indexes to this PR branch
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- 全道纹索引.md AI_CONTEXT.md; then
            echo "Generated indexes are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 全道纹索引.md AI_CONTEXT.md
          git commit -m "Regenerate derived DaoWen index and AI context"
          git push origin "HEAD:$BRANCH"

      - name: Run real-engine randomized PvP
        env:
          RUNS: ${{ github.event.inputs.runs || '30' }}
          SEED: ${{ github.event.inputs.seed || '20261118' }}
        run: |
          python sim/audits/random_pvp_lab.py \
            --runs "$RUNS" \
            --seed "$SEED" \
            --max-rounds 40 \
            --max-wall-seconds 30 \
            --output-dir artifacts/random-pvp

      - name: Upload battle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: random-pvp-${{ github.run_number }}
          path: artifacts/random-pvp/
          if-no-files-found: warn
          retention-days: 30
