# ============================================================================
# 非致死类特殊事件 —— 结构化事实源（雕塑批，2026-10-09）
#
# 方向：**本文件是源**，与 lethal_events.toml 并列，共同派生《死者之书.md》
# 「## 规则」节的「特殊事件」章（两份文件按 order 合并排序，禁止手改）：
#   1. 引擎常量（MonsterLifeMixin.SCULPTURE_DAMAGE 等，见 engine/rules_source.py）
#   2. 《死者之书.md》的「## 规则」节（署名 ？？？，由 sim/gen_rules.py 生成）
#
# 适用范围：规则正文.md「特殊事件」节里**非致死**的特殊事件（永久离场、转化、叛乱
# 等，非[命零]死亡）。致死类事件仍归 lethal_events.toml——那边有死因文案与
# 进度计数，schema 不同。两份文件同章同署名，order 不许撞车（测试钉住）。
#
# 为什么 2026-10-09 才补：2026-10-08 样板批只移植了致死类三事件（迷失/癌变/
# 凡庸），雕塑是永久离场而非命零，不符合 lethal schema，漏网至今。
#
# schema（按非致死事件来，字段随事件自身数值需要）：
#   durability_ratio / durability_min：雕塑消耗品耐久 = ceil([血限]×ratio)，至少 min
#   damage_per_durability / shield_per_durability：雕塑每消耗1点耐久的伤害 / 格挡
#   trigger：触发条件（给人/AI 读的说明，引擎不使用本字段）
#   rule_lines：规则正文.md「特殊事件」节原文，逐行照录（测试断言与规则正文逐字一致，
#               且与结构化数值互相咬住——改 toml 不改规则正文 会挂测试）
#
# 一致性由 tests/test_special_events_source.py 守（toml ↔ 引擎 ↔ 死者之书 ↔ 规则正文）。
# ============================================================================

version = 1
chapter = "特殊事件"
# 死者之书「## 规则」节里每条规则的署名。遗言署真人姓名、可能有真假；
# 规则署 ？？？、所有人看到的都一样（2026-10-08 用户令）。
signature = "？？？"


# ---------------------------------------------------------------------------
# 雕塑：攻次与攻力同时归0 → 化为雕塑消耗品（永久离场，不视为击杀）
# ---------------------------------------------------------------------------
[[event]]
id = "diaosu"
name = "雕塑"
order = 4

# ---- 结构化数值：引擎直接读，行为由这些字段决定 ----
durability_ratio = 0.05        # 耐久上限 = ceil([血限] × 本系数)
durability_min = 1             # 耐久下限（血限过低时保底 1）
damage_per_durability = 15     # 每消耗1点耐久：对1个[目标]造成的伤害
shield_per_durability = 20     # 每消耗1点耐久：自身获得的格挡
# 触发条件怎么判定（给人/AI 读的说明，引擎不使用本字段）
trigger = "攻击次数与攻击力同时归0（DM裁定2026-09-10，原为「之一归0」）"

# ---- 规则正文：规则正文.md「特殊事件」节的原文，逐行照录 ----
rule_lines = [
  "雕塑（任意角色的攻击次数和攻击力同时变为0时触发）",
  "该角色化为对应雕塑消耗品（X/Y，Y=其[血限]5%）；每消耗1点耐久，可对1个[目标]造成15点伤害，或使自身获得20点格挡。",
]

# ---------------------------------------------------------------------------
# 死者之页：已接入规则正文的特殊事件事实源
# ---------------------------------------------------------------------------
[[event]]
id = "si_zhicheng"
name = "死者之页"
order = 5
rule_lines = [
  "死者之页（轮回者[命零]时触发）",
  "《死者之书》为此新增一页：〖生平〗由引擎按其本趟轮回的事实（含死因）自动总结，〖遗言〗由本人自定义一句话，最多20字，除此之外没有其他限制；本人没留下话时可以不写遗言。",
]

# ---------------------------------------------------------------------------
# 还债：已接入规则正文的特殊事件事实源
# ---------------------------------------------------------------------------
[[event]]
id = "huanzhai"
name = "还债"
order = 6
threshold = 10
rule_lines = [
  "还债（任意角色的碎片余额达到其动态负债阈值时触发；常见于罪孽都市与祭坛）",
  "每名角色分别记录本局历史最高碎片余额 M。M 初始为本局开始时真实碎片余额与0中的较大值；每当当前碎片余额刷新历史最高值时，立即更新 M。M 只增不减，消费、交易、负债或余额跌为负数都不会抹去历史记录。",
  "动态负债阈值为 10+M。任意角色当前真实碎片余额 B≤-(10+M) 时立即触发还债，不限怪物、轮回者、[朋友]或[员工]。例如 M=100 时，死亡/吞噬线为余额≤-110。提高可承受负债的唯一方式，是在本局获得碎片并刷新自己的历史最高余额；卖出遗物所得只有在实际记入碎片余额并刷新纪录时才可能提高 M。",
  "怪物原本就允许碎片类代价透支：余额不足时不拒绝发动，真碎片直接扣成负数（2026-10-13：【逼债】删除，原「无力支付部分记负债」半句随道纹移除）。其他角色的普通碎片类代价仍遵守余额不足拒绝发动；祭坛投资是例外，按其自身规则结算并允许余额跌入负数。祭坛黑天鹅造成的额外 2X 负债直接记入真实碎片余额，不设独立隐藏债务账本。",
  "触发后按角色类型结算：",
  "- 怪物：将其视为[员工]立即参战，并进入独立债务轨道：不结算工资、不计入失信黑名单；轮回者一次付清其全部负债[碎片]后该[员工]离队。",
  "- 轮回者、[朋友]或[员工]：被祭坛/债务吞噬，立即死亡并离场，不触发普通击杀奖励，也不掉落遗物。该结算不能通过普通撤退规避。",
]

# ---------------------------------------------------------------------------
# 夺书（2026-10-24 用户令：不单开「背叛行动」——它就是「视野内目标，可以自由
# 选择是否战斗」这个通用机制的应用）。用 chapter 覆盖本书章名，渲染进「同伴规则」章。
# ---------------------------------------------------------------------------
[[event]]
id = "duoshu"
name = "夺书"
order = 7
chapter = "同伴规则"
rule_lines = [
  "夺书（[朋友]或[员工]的自选项；不是特殊事件，也不设专门行动）",
  "[朋友]或[员工]可以自己决定要不要夺取《死者之书》。这不需要任何专属机制：按「视野内目标」通用规则，谁想夺书谁就对你开战，你同样可以自由选择应战或让行。没有攻击总值门槛，不在[战终]自动判定，也不由DM代为发动。",
  "夺书是战斗胜负的结果：推翻并取代持有者后，夺得《死者之书》，成为新的轮回者。",
]

