# ============================================================================
# 致死类特殊事件 —— 结构化事实源（样板批，2026-10-08）
#
# 方向：**本文件是源**，下面四样东西全部由它派生，禁止在任何一端手改：
#   1. 引擎常量（Entity.MUTATION_COLLAPSE_THRESHOLD 等，见 engine/rules_source.py）
#   2. 致死进度渲染（Entity.lethal_progress 的格式串）
#   3. 死者之书死因文案（engine/death_book.py::CAUSE_DRAFTS）
#   4. 《死者之书.md》的「## 规则」节（署名 ？？？，由 sim/gen_rules.py 生成）
#
# 为什么用 TOML 不用 YAML：引擎至今零第三方依赖（纯 stdlib），而运行环境是
# PEP-668 受管的，为一个事实源引入 PyYAML 不值得。tomllib 是 3.11 自带。
# 若日后愿意接受依赖，换成 YAML 只需改 engine/rules_source.py 的加载器。
#
# 一致性由 tests/test_lethal_rules_source.py 三方守（toml ↔ 引擎 ↔ 死者之书）。
# ============================================================================

version = 1
chapter = "特殊事件"
# 死者之书「## 规则」节里每条规则的署名。遗言署真人姓名、可能有真假；
# 规则署 ？？？、所有人看到的都一样（2026-10-08 用户令）。
signature = "？？？"


# ---------------------------------------------------------------------------
# 迷失：非怪物角色异变叠满；怪物不触发
# ---------------------------------------------------------------------------
[[event]]
id = "mishi"
name = "迷失"
order = 1

# ---- 结构化数值：引擎直接读，行为由这些字段决定 ----
threshold = 50
# 2026-10-13 用户令：怪物照常累计异变，但不会触发迷失。
excluded_entity_types = ["怪物"]
counter_field = "mutation_count"
counter_label = "异变层数"
# 阈值怎么算出来的（给人/AI 读的说明，引擎不使用本字段）
threshold_expr = "固定值 50"

# ---- 派生文本：引擎与文档共用同一份，避免各处各写一遍 ----
death_cause_key = "collapse"
death_cause_text = "异变叠满迷失命零"
progress_format = "{name}（{current}/{limit}）"

# ---- 规则正文：规则正文.md「特殊事件」节的原文，逐行照录 ----
rule_lines = [
  "迷失（非怪物角色【异变】达到50层时触发；怪物不会触发）",
  "该角色直接判定[命零]死亡，尸体变为怪物",
]


# ---------------------------------------------------------------------------
# 癌变：本场累计回复达血限×2
# ---------------------------------------------------------------------------
[[event]]
id = "aibian"
name = "癌变"
order = 2

# CANCER_HEAL_MULTIPLIER：阈值 = ceil(血限 × 本系数)
threshold_multiplier = 2.0
counter_field = "total_healed"
counter_label = "本场累计回复量"
threshold_expr = "⌈血限 × 2⌉（threshold_multiplier = 2.0）"

death_cause_key = "cancer"
death_cause_text = "回复过量触发癌变"
progress_format = "{name}（{current}/{limit}）"

rule_lines = [
  "癌变（任一角色在本场战斗内累计受到回复=2×其[血限]时触发。累计回复属于局内减益追踪，[战终]清零；局外【休整】不计入该累计）",
  "轮回者、[朋友]、[员工]及其他非怪物角色的身体无法承受这种强度的细胞分裂，直接判定[命零]死亡。怪物触发癌变时不按普通击杀结算，改为被吸收进《死者之书》，不提供[碎片]奖励；每吸收一只癌变怪物，获得【无限肉块】（1/1）：使用后恢复10点生命，不计入本场累计回复量；战终自愈80%已损耐久，向上取整。癌变不再为局外【休整】提供任何额外恢复量。",
]


# ---------------------------------------------------------------------------
# 凡庸：连续 5 回合未出手 / 未使敌对角色掉血
# ---------------------------------------------------------------------------
[[event]]
id = "fanyong"
name = "凡庸"
order = 3

threshold = 5
# 两个计数器取更接近阈值的那条（见 Entity.lethal_counters）
counter_field = "no_action_rounds"
alt_counter_field = "no_damage_rounds"
counter_label = "连续空转回合数"
threshold_expr = "固定值 5"

death_cause_key = "mediocrity"
death_cause_text = "连续五回合触发凡庸"
progress_format = "{name}（{current}/{limit}）"
# 两个计数器取更接近阈值的那条；显示键带后缀，面板上要能看出是哪条在逼近
progress_keys = ["凡庸·未出手", "凡庸·未致敌掉血"]

rule_lines = [
  "凡庸（任一角色连续五回合未出手/五回合未能使敌对角色生命减少时触发）",
  "多个角色触发凡庸时，非轮回者优先触发；按优先序逐个结算，一旦先炸裂的角色已经清空某一方战场（战斗胜负已定），立即中断剩余凡庸结算，幸存一方尚未结算的待爆者不再炸裂（其计数随战斗结束清零）。",
  "该角色的无能让某人感到无趣，于是其凭空全身炸裂，如果是轮回者直接死亡，如果是怪物则命零死亡，轮回者获得自由结晶（1/1）：对[目标]使用后使其随机付出一种代价，共计10；若目标是生命≤20%[血限]的怪物，强制触发救赎事件",
]
