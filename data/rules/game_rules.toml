order = 1
# 完整正文在 规则正文.md「核心规则」节的位置（人读追溯用）
source = "规则正文.md「核心规则」· 自由规则"

# 完整正文：规则正文原文，逐行照录（测试断言与规则正文逐字一致）
# 2026-10-24 用户令：自由控X 不是一条独立规则，它就是自由规则的推论
# （「没禁止的都允许」对 X 的取值同样成立），所以并进本条、不再单独成页。
precise_lines = [
  "自由规则：只要没有明确禁止的任何操作都是允许的——发动的道纹或法术，其公式中的代数 X 同样由施法者按当前剩余法力与战术需求自选（1 ≤ X ≤ 当前可用法力/代价上限），不必一次清空全部法力；X=0 即拒绝发动：轮到发动而选择不发时，显式提交 X=0，该次发动不支付代价、不消耗出手、不产生任何结算，也不判定为一次失败的尝试（与「轮空／让行」同义）。",
]

