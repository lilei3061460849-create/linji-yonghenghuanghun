# ============================================================================
# 核心规则 —— 底层逻辑压缩批（2026-10-09 定稿）
#
# 方向：**本文件是源**，《死者之书.md》「## 规则」节的「核心规则」章由它派生，
# 禁止在书里手改：改 toml → 跑 `python3 sim/gen_rules.py` → 跑一致性测试。
#
# 适用范围（2026-10-09 用户令）：**只保留从始至终不会改变的底层逻辑，共 6 条**——
# 自由（含自由控X）、随机数、整数、属性上限、代价。其余规则（可调数值、机制细则、
# 残韵/局外/怪物准则、道纹正文、事件池等）**不进书**——它们随时可能调整；
# 完整正文始终以 《规则正文》为准。
#
# 与 lethal_events.toml 的分工：
#   - lethal_events：结构化数值直接驱动引擎（阈值/死因/进度串），rule_lines 是
#     规则正文原文照录；
#   - game_rules：底层逻辑的**玩家压缩版**。每条规则同时存两份文本——
#     `precise_lines`：规则正文原文，逐行照录（一致性测试断言与规则正文逐字
#     一致——改规则正文 不同步本文件会挂测试，防压缩悄悄漂移）；
#     `rule_lines`：压缩后的讲述，进死者之书，署名 ？？？。
#
# 压缩口径（2026-10-09 用户令：规则压进死者之书、降低阅读门槛、诡异是美学）：
#   一条逻辑压成一句警句，保留原则核心，删掉展开与动机；**只压缩，不造假**——
#   规则节「所有人看到的都一样」，不得与引擎结算矛盾；误导留给署人名的遗言层
#   （遗言可能有真假）。
#
# 压缩稿**全部为用户亲稿**（2026-10-09 定稿，文言警句、宇宙论口吻）。
# 今后新增底层逻辑：追加 [[rule]]（precise_lines 照录 规则正文原文 + rule_lines
# 压缩讲述）→ 跑 `python3 sim/gen_rules.py` → 跑 tests/test_game_rules_source.py。
# 一致性由 tests/test_game_rules_source.py 守（toml ↔ 规则正文 ↔ 死者之书）。
# ============================================================================

