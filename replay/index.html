<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101318">
<title>战局回放</title>
<style>
:root{color-scheme:dark;--bg:#101318;--panel:#191e26;--line:#303744;--text:#e8edf5;--muted:#98a4b6;--blue:#6ca7ff;--red:#ff7777;--gold:#e8c36a;--green:#7bd8ad}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:960px;margin:auto;padding:14px;padding-bottom:28px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}h1{font-size:21px;margin:0}small,.muted{color:var(--muted)}button,select,.file-button{min-height:42px;border:1px solid var(--line);background:#242b36;color:var(--text);border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}button:active{transform:translateY(1px)}button.primary{background:#244e82;border-color:#3c6fa9}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}.board{display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);align-items:stretch;gap:8px}.fighter{min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;background:#141820}.fighter .symbol{display:grid;place-items:center;margin:0 auto 8px;width:46px;height:46px;border:2px solid currentColor;border-radius:12px;font-size:21px;font-weight:800}.fighter.ally{color:var(--blue)}.fighter.enemy{color:var(--red)}.fighter strong{display:block;overflow-wrap:anywhere;color:var(--text)}.fighter .stats{font-size:12px;color:var(--muted);margin-top:7px;overflow-wrap:anywhere}.versus{display:grid;place-items:center;color:var(--gold);font-size:20px;font-weight:800}.event-head{display:flex;justify-content:space-between;align-items:start;gap:10px}.event-title{font-size:18px;font-weight:750}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 8px;font-size:12px;color:var(--muted);white-space:nowrap}.event-detail{margin-top:10px;padding:10px;border-radius:9px;background:#11151b;overflow-wrap:anywhere}.kv{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #272e38;padding:5px 0}.kv:last-child{border-bottom:0}.value{font-variant-numeric:tabular-nums;text-align:right}.timeline{width:100%;accent-color:var(--blue);margin:12px 0 4px}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:7px}.controls button{padding:8px 4px}.event-list{display:grid;gap:6px;max-height:320px;overflow:auto}.event-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;width:100%;background:#141820;border:1px solid transparent;min-height:48px}.event-row.active{border-color:var(--blue);background:#1b2a3d}.event-row .round{font-size:12px;color:var(--muted)}.event-row .summary{overflow-wrap:anywhere}.empty{padding:20px;text-align:center;color:var(--muted)}input[type=file]{display:none}.footer{font-size:12px;color:var(--muted);margin-top:8px}@media(min-width:700px){main{padding:24px}.fighter{padding:20px}.fighter .symbol{width:56px;height:56px}.board{grid-template-columns:minmax(0,1fr) 90px minmax(0,1fr)}}
</style>
</head>
<body><main>
<header class="top"><div><h1 id="title">战局回放</h1><small id="subtitle">导入引擎导出的 replay.json</small></div><label class="file-button" for="file">导入回放</label><input id="file" type="file" accept="application/json,.json"></header>
<section class="panel"><div class="event-head"><div><div id="eventTitle" class="event-title">等待回放文件</div><small id="eventMeta">选择一个 replay.json 开始查看</small></div><span id="eventCount" class="pill">0 个事件</span></div>
<div class="board" style="margin-top:14px"><div id="actorCard" class="fighter ally"><div class="symbol">A</div><strong>行动者</strong><div class="stats">等待事件</div></div><div class="versus" id="arrow">·</div><div id="targetCard" class="fighter enemy"><div class="symbol">B</div><strong>目标</strong><div class="stats">等待事件</div></div></div>
<div id="detail" class="event-detail"><div class="empty">战斗过程会在这里逐条展示。两侧角色卡表示当前事件的行动者与目标。</div></div>
</section>
<section class="panel"><div class="controls"><button id="prev">◀ 上一条</button><button id="play" class="primary">▶ 播放</button><button id="next">下一条 ▶</button><select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></div><input id="timeline" class="timeline" type="range" min="0" max="0" value="0" aria-label="回放时间轴"><div class="event-head"><small id="position">0 / 0</small><small id="battleRound">战斗 / 回合</small></div></section>
<section class="panel"><div class="event-head"><strong>事件列表</strong><small class="muted">点击任意事件跳转</small></div><div id="events" class="event-list" style="margin-top:10px"><div class="empty">尚未载入回放。</div></div><div class="footer">此页面只展示已结算事件，不会重跑战斗、AI 或随机数。首版地图坐标尚未接入。</div></section>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let replay=null,index=0,timer=null;
const labels={battle_start:'战斗开始',round_start:'回合开始',action_declared:'行动声明',dodge_declared:'声明闪避',before_damage:'伤害结算前',damage_applied:'伤害结算',heal_applied:'治疗结算',blood_limit_changed:'血限变化',status_applied:'状态施加',status_expired:'状态结束',entity_retreated:'角色撤退',entity_died:'角色死亡',round_end:'回合结束',battle_end:'战斗结束',consumable_zi_yu:'消耗品效果'};
const niceKey=k=>({'raw_damage':'原始伤害','actual_damage':'实际伤害','actual_life_loss':'实际生命损失','shield_absorbed':'格挡吸收','hp_before':'结算前生命','hp_after':'结算后生命','heal_amount':'回复量','actual_heal':'实际回复','overheal':'溢出回复','damage_type':'伤害类型','status':'状态','status_name':'状态','amount':'数值','reason':'原因','dodge':'闪避','fully_dodged':'完全闪避','blood_limit_before':'原血限','blood_limit_after':'新血限'}[k]||k);
const text=(el,value)=>{el.textContent=value==null?'':String(value)};
function displayValue(v){if(v===null||v===undefined)return '无';if(typeof v==='object')return JSON.stringify(v);if(typeof v==='boolean')return v?'是':'否';return String(v)}
function makeCard(id,name,side,stats,symbol){const el=$(id);el.className='fighter '+side;el.replaceChildren();const icon=document.createElement('div');icon.className='symbol';text(icon,symbol);const title=document.createElement('strong');text(title,name||'未记录');const status=document.createElement('div');status.className='stats';text(status,stats||'');el.append(icon,title,status)}
function eventSummary(e){const type=labels[e.event_type]||e.event_type||'未知事件';const a=e.actor_name||'';const t=e.target_name||'';const d=e.data||{};if(e.event_type==='damage_applied')return `${a} 对 ${t} 造成 ${d.actual_damage??d.raw_damage??'?'} 点伤害`;if(e.event_type==='heal_applied')return `${a||t} 回复 ${d.actual_heal??d.heal_amount??'?'} 点生命`;if(e.event_type==='entity_died')return `${t||a||'角色'} 死亡`;if(a&&t&&a!==t)return `${a} → ${t}`;return a||t||type}
function stop(){if(timer){clearInterval(timer);timer=null}text($('play'),'▶ 播放')}
function render(){if(!replay||!replay.events.length){text($('eventTitle'),'没有可播放的战斗事件');text($('position'),'0 / 0');return}index=Math.max(0,Math.min(index,replay.events.length-1));const e=replay.events[index],d=e.data||{},type=labels[e.event_type]||e.event_type||'未知事件';text($('eventTitle'),type);text($('eventMeta'),eventSummary(e));text($('eventCount'),`${replay.events.length} 个事件`);text($('position'),`${index+1} / ${replay.events.length}`);text($('battleRound'),`战斗 ${e.battle_no??0} · 回合 ${e.round_no??0}`);$('timeline').value=String(index);
const actor=(replay.participants||[]).find(p=>p.name===e.actor_name),target=(replay.participants||[]).find(p=>p.name===e.target_name);const stats=p=>p?`生命 ${p.current_hp??'?'} / ${p.blood_limit??'?'} · 法力 ${p.current_mana??'?'} / ${p.mana_limit??'?'}`:'';makeCard('actorCard',e.actor_name||'环境 / 系统',actor?.side||'ally',stats(actor),actor?.side==='enemy'?'M':'A');makeCard('targetCard',e.target_name||'全场 / 无单一目标',target?.side||'enemy',stats(target),target?.side==='ally'?'A':'B');text($('arrow'),['damage_applied','before_damage'].includes(e.event_type)?'➜':e.event_type==='dodge_declared'?'↝':e.event_type==='heal_applied'?'＋':e.event_type==='entity_died'?'✕':'·');
const detail=$('detail');detail.replaceChildren();const summary=document.createElement('div');summary.className='kv';const k=document.createElement('span');text(k,'事件');const v=document.createElement('span');v.className='value';text(v,eventSummary(e));summary.append(k,v);detail.append(summary);Object.entries(d).forEach(([key,value])=>{const row=document.createElement('div');row.className='kv';const label=document.createElement('span');text(label,niceKey(key));const val=document.createElement('span');val.className='value';text(val,displayValue(value));row.append(label,val);detail.append(row)});if(!Object.keys(d).length){const empty=document.createElement('div');empty.className='muted';text(empty,'该事件没有附加数值。');detail.append(empty)}
const list=$('events');list.replaceChildren();replay.events.forEach((item,i)=>{const b=document.createElement('button');b.className='event-row'+(i===index?' active':'');b.type='button';const round=document.createElement('span');round.className='round';text(round,`R${item.round_no??0}`);const summary=document.createElement('span');summary.className='summary';text(summary,eventSummary(item));const typePill=document.createElement('span');typePill.className='pill';text(typePill,labels[item.event_type]||item.event_type||'?');b.append(round,summary,typePill);b.addEventListener('click',()=>{stop();index=i;render()});list.append(b)});const active=list.children[index];if(active&&active.scrollIntoView&&index>0)active.scrollIntoView({block:'nearest'});
}
function load(data){if(!data||!Array.isArray(data.events))throw new Error('回放 JSON 缺少 events 数组');replay=data;index=0;stop();text($('title'),data.title||'战局回放');const m=data.metadata||{};text($('subtitle'),`${m.region||'未知副本'} · ${m.event_count??data.events.length} 条事件`);$('timeline').max=String(Math.max(0,data.events.length-1));render()}
$('file').addEventListener('change',async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;try{load(JSON.parse(await file.text()))}catch(err){alert('无法读取回放文件：'+err.message)}e.target.value=''});
$('prev').addEventListener('click',()=>{stop();index=Math.max(0,index-1);render()});$('next').addEventListener('click',()=>{stop();index=Math.min((replay?.events.length||1)-1,index+1);render()});$('timeline').addEventListener('input',e=>{stop();index=Number(e.target.value)||0;render()});$('play').addEventListener('click',()=>{if(!replay||!replay.events.length)return;if(timer){stop();return}if(index>=replay.events.length-1)index=0;text($('play'),'Ⅱ 暂停');timer=setInterval(()=>{if(index>=replay.events.length-1){stop();return}index++;render();text($('play'),'Ⅱ 暂停')},900/Number($('speed').value))});$('speed').addEventListener('change',()=>{if(timer){stop();$('play').click()}});
const demo={schema_version:1,title:'演示战斗 · 两格之间如何展示完整过程',metadata:{region:'演示副本',event_count:7},participants:[{name:'轮回者 A',side:'ally',current_hp:80,blood_limit:100,current_mana:20,mana_limit:30},{name:'怪物 B',side:'enemy',current_hp:0,blood_limit:45,current_mana:0,mana_limit:10}],events:[{sequence:0,event_type:'battle_start',battle_no:1,round_no:0,actor_name:'',target_name:'',data:{participants:['轮回者 A','怪物 B']}},{sequence:1,event_type:'round_start',battle_no:1,round_no:1,actor_name:'轮回者 A',target_name:'',data:{}},{sequence:2,event_type:'action_declared',battle_no:1,round_no:1,actor_name:'轮回者 A',target_name:'怪物 B',data:{action:'普通攻击'}},{sequence:3,event_type:'before_damage',battle_no:1,round_no:1,actor_name:'轮回者 A',target_name:'怪物 B',data:{raw_damage:20,damage_type:'普通'}},{sequence:4,event_type:'dodge_declared',battle_no:1,round_no:1,actor_name:'怪物 B',target_name:'轮回者 A',data:{fully_dodged:false}},{sequence:5,event_type:'damage_applied',battle_no:1,round_no:1,actor_name:'轮回者 A',target_name:'怪物 B',data:{raw_damage:20,actual_damage:20,actual_life_loss:20,hp_before:20,hp_after:0}},{sequence:6,event_type:'entity_died',battle_no:1,round_no:1,actor_name:'轮回者 A',target_name:'怪物 B',data:{reason:'生命归零'}}]};
load(demo);
})();
</script></body></html>
